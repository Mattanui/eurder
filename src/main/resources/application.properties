spring.application.name=eurder

# Logging: INFO for the frameworks, DEBUG for our own code
logging.level.root=INFO
logging.level.com.eurder=DEBUG
logging.file.name=log/application.log

# Include the exception message in Spring Boot's default error response
server.error.include-message=always

# Administrator account, created at startup (no database yet)
eurder.admin.email=admin@eurder.com
eurder.admin.password=${EURDER_ADMIN_PASSWORD:change-me-locally}

# Business time zone: "today" (order date, shipping dates) is computed in this zone
eurder.time-zone=Europe/Brussels