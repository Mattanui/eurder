spring.application.name=eurder

# Logging: INFO for the frameworks, DEBUG for our own code
logging.level.root=INFO
logging.level.com.eurder=DEBUG
logging.file.name=log/application.log

# Include the exception message in Spring Boot's default error response
server.error.include-message=always

# Administrator account, created at startup (no database yet)
eurder.admin.email=admin@eurder.com
eurder.admin.password=${EURDER_ADMIN_PASSWORD}

# Business time zone: "today" (order date, shipping dates) is computed in this zone
eurder.time-zone=Europe/Brussels

# Database (PostgreSQL). The password is a secret: it comes from the environment.
spring.datasource.url=jdbc:postgresql://ec2-15-237-74-163.eu-west-3.compute.amazonaws.com:443/${DB_NAME}?currentSchema=eurder
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# The schema belongs to Flyway (db/migration): Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading from the controllers: everything is loaded inside the service transaction
spring.jpa.open-in-view=false